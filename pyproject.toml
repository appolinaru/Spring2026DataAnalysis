[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-rag"
version = "0.1.0"
description = "RAG-поиск по архитектурным нормативам"
requires-python = ">=3.9"
dependencies = [
    "loguru>=0.7.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
